name: WIF

on:
  workflow_dispatch:

jobs:
  main:
    name: CI
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      
      - name: Install go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Build
        run: make build

      - name: Print GitHub OIDC claims
        run: |
          # Fetch the OIDC ID Token using GitHub runner environment variables
          RAW_JWT=$(curl -sLS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r '.value')

          echo "=== Full OIDC Token Payload ==="
          echo "$RAW_JWT" | jq -R 'split(".") | .[1] | @base64d | fromjson'

          echo "=== Subject Claim (sub) ==="
          echo "$RAW_JWT" | jq -R -r 'split(".") | .[1] | @base64d | fromjson | .sub'

      - name: Get access token
        run: |
          TOKEN=$(./bin/stackit auth activate-service-account --use-oidc --only-print-access-token --verbosity debug)
          echo "::add-mask::$TOKEN"
          echo "STACKIT_ACCESS_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
        env:
          STACKIT_SERVICE_ACCOUNT_EMAIL: marcelj-2g78bs1@sa.stackit.cloud

      - name: Execute command
        run: ./bin/stackit network list --project-id "$PROJECT_ID"
        env:
          PROJECT_ID: 66b03760-125b-4c63-9624-741e8a418c02