name: WIF

on:
  workflow_dispatch:
    inputs:
      cluster_name:
        description: "SKE Cluster Name to test kubectl against"
        required: true
        default: "mj-test"
      organization_id:
        description: "Organization ID for the SKE cluster"
        required: true
        default: "d83100e9-9be4-45ad-b874-28166786ec0c"
      region:
        description: "STACKIT Region"
        required: false
        default: "eu01"

jobs:
  main:
    name: CI
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      PROJECT_ID: 66b03760-125b-4c63-9624-741e8a418c02
      STACKIT_SERVICE_ACCOUNT_EMAIL: marcelj-2g78bs1@sa.stackit.cloud
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      
      - name: Install go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Build
        run: make build

      - name: Add binary to PATH
        run: echo "$(pwd)/bin" >> "$GITHUB_PATH"

      - name: Build Barebones Kubeconfig from Scratch
        run: |
          # 1. Set the cluster server endpoint (get it once from STACKIT Portal/describe)
          kubectl --kubeconfig /tmp/manual-kubeconfig.yaml config set-cluster my-cluster \
            --server="https://api.mj-test.60e7c9223b.s.ske.eu01.onstackit.cloud" \
            --insecure-skip-tls-verify=true

          # 2. Set the context
          kubectl --kubeconfig /tmp/manual-kubeconfig.yaml config set-context my-cluster \
            --cluster=my-cluster \
            --user=my-sa-user

          # 3. Set the active context
          kubectl --kubeconfig /tmp/manual-kubeconfig.yaml config use-context my-cluster

          # 4. Set the exec credential plugin (the new command)
          kubectl --kubeconfig /tmp/manual-kubeconfig.yaml config set-credentials my-sa-user \
            --exec-api-version="client.authentication.k8s.io/v1" \
            --exec-interactive-mode="Never" \
            --exec-command="stackit" \
            --exec-arg="ske" \
            --exec-arg="kubeconfig" \
            --exec-arg="login" \
            --exec-arg="--idp" \
            --exec-arg="--cluster-name" \
            --exec-arg="${{ github.event.inputs.cluster_name }}" \
            --exec-arg="--organization-id" \
            --exec-arg="${{ github.event.inputs.organization_id }}" \
            --exec-arg="--project-id" \
            --exec-arg="$PROJECT_ID" \
            --exec-arg="--region" \
            --exec-arg="${{ github.event.inputs.region || 'eu01' }}"

      - name: Test Kubectl against barebones kubeconfig
        run: |
          kubectl --kubeconfig /tmp/manual-kubeconfig.yaml cluster-info
          kubectl --kubeconfig /tmp/manual-kubeconfig.yaml get nodes
        env:
          STACKIT_SERVICE_ACCOUNT_EMAIL: ${{ env.STACKIT_SERVICE_ACCOUNT_EMAIL }}